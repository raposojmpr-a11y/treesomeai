# Apenas nas chamadas de leitura de pedir. Sem shell, escrita ou subagentes.
[[rule]]
toolName = "*"
decision = "deny"
priority = 100

[[rule]]
toolName = ["read_file", "list_directory", "glob", "grep_search", "google_web_search", "web_fetch", "get_internal_docs", "complete_task"]
decision = "allow"
priority = 200
